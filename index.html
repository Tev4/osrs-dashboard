<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>OSRS Dashboard</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><text y='13' font-size='13'>&#129689;</text></svg>" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<header class="topbar">
  <div class="topbar__title">
    <a class="topbar__wikilogo" id="sourceLink" href="https://oldschool.runescape.wiki/"
       target="_blank" rel="noopener noreferrer"
       title="Old School RuneScape Wiki (opens in a new tab)"
       aria-label="Old School RuneScape Wiki, money making guide (opens in a new tab)">
      <img src="assets/wiki-logo.svg" alt="" width="40" height="40" decoding="async" />
    </a>
    <h1>Dashboard</h1>
  </div>
  <div class="topbar__status">
    <span class="dot" id="statusDot" data-status="idle" title="Status"></span>
    <span id="statusText">Loading&hellip;</span>
    <button id="refreshBtn" class="btn" type="button" title="Refresh now">Refresh</button>
  </div>
</header>

<nav class="tabbar" role="tablist" aria-label="Sections">
  <button class="tab is-active" id="tabMakers" type="button" role="tab" aria-selected="true" aria-controls="panelMakers">GP Making Methods</button>
  <button class="tab" id="tabLevels" type="button" role="tab" aria-selected="false" aria-controls="panelLevels">My skill levels</button>
</nav>

<div id="banner" class="banner" hidden></div>

<section id="panelMakers" role="tabpanel" aria-labelledby="tabMakers">
<main class="layout">

  <!-- ============ LEFT: filters ============ -->
  <aside class="sidebar">

    <section class="panel">
      <div class="panel__head">
        <h2 class="panel__title">Categories</h2>
        <button id="clearCategories" class="btn btn--small" type="button">Clear</button>
      </div>
      <div id="categoryList" class="categories" role="group" aria-label="Money making categories"></div>
    </section>

    <section class="panel">
      <h2 class="panel__title">Skills</h2>
      <div class="panel__row panel__row--split">
        <div class="modes" role="radiogroup" aria-label="Skill match mode">
          <label><input type="radio" name="skillMode" value="any" checked /> Any</label>
          <label><input type="radio" name="skillMode" value="all" /> All</label>
        </div>
        <button id="clearSkills" class="btn btn--small" type="button">Clear</button>
      </div>
      <div id="skillList" class="skills" role="group" aria-label="Filter by skill"></div>
    </section>

  </aside>

  <!-- ============ RIGHT: results ============ -->
  <section class="results">
    <div class="results__bar">
      <input id="methodSearch" class="input input--search" type="search" placeholder="Search methods…" autocomplete="off" aria-label="Search methods and categories" />
      <label class="toggle" id="canDoLabel" title="Only show methods within your levels (set them in the My levels tab)">
        <input type="checkbox" id="canDoOnly" />
        <span class="toggle__box" aria-hidden="true"></span>
        <span class="toggle__label">Can do</span>
      </label>
      <div id="intensityFilters" class="pills" role="group" aria-label="Filter by intensity">
        <button type="button" class="pill pill--low" data-rank="1" aria-pressed="false">Low</button>
        <button type="button" class="pill pill--moderate" data-rank="2" aria-pressed="false">Moderate</button>
        <button type="button" class="pill pill--high" data-rank="3" aria-pressed="false">High</button>
      </div>
      <span id="resultCount" class="results__count">&mdash;</span>
    </div>

    <div class="mmg-wrap">
      <table class="mmg">
        <thead>
          <tr>
            <th class="col-profit" data-sort="profit" aria-sort="descending">
              <button type="button" class="sort-btn">Hourly profit<span class="caret" aria-hidden="true"></span></button>
            </th>
            <th class="col-method" data-sort="method" aria-sort="none">
              <button type="button" class="sort-btn">Method<span class="caret" aria-hidden="true"></span></button>
            </th>
            <th class="col-skills th--plain">Skills</th>
            <th class="col-category th--plain">Category</th>
          </tr>
        </thead>
        <tbody id="tbody">
          <tr class="empty"><td colspan="4">Loading the money making guide&hellip;</td></tr>
        </tbody>
      </table>
    </div>
  </section>

</main>
</section>

<!-- ============ TAB: my levels ============ -->
<section id="panelLevels" role="tabpanel" aria-labelledby="tabLevels" hidden>
  <div class="levels">
    <header class="levels__head">
      <div>
        <p class="levels__hint">
          Type your real levels — the <code>+</code> on the wiki is implied, so <code>90</code> covers
          "90+".
          <br>Then tick
          <strong>Can do</strong> above the table to hide anything beyond you.
        </p>
      </div>
    </header>
    <div id="levelGrid" class="level-grid"></div>
    <div class="levels__actions">
      <div class="hiscore-lookup">
        <input id="hiscoreName" class="input input--hiscore" type="text" placeholder="Character name" autocomplete="off" spellcheck="false" aria-label="OSRS character name" />
        <a id="hiscoreLink" class="hiscore-link" href="https://secure.runescape.com/m=hiscore_oldschool/index_lite.ws?player=" target="_blank" rel="noopener noreferrer" title="Open hiscores page (copy the CSV, then click Import levels from clipboard)" aria-label="Open hiscores page">
          <svg class="loop-icon" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true" focusable="false">
            <path d="M15.5 14h-.79l-.28-.27A6.47 6.47 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z" fill="currentColor"/>
          </svg>
        </a>
      </div>
      <button id="hiscoreFill" class="btn btn--input" type="button">Import levels from clipboard</button>
      <span id="hiscoreStatus" class="hiscore-status" aria-live="polite"></span>
    </div>
    <div class="hiscore-paste">
      <button id="clearLevels" class="btn btn--lg btn--danger" type="button">Clear all</button>
    </div>
  </div>
</section>

<script src="app.js"></script>
</body>
</html>
